aid: five-jack
name: Five Jack
description: >-
  Five Jack (PT. Five Jack) is the Indonesian company behind itemku, one of Southeast Asia's largest
  digital-goods marketplaces for gamers. Founded in 2014 as a game price-comparison and classifieds
  platform, itemku grew into a full marketplace where buyers and sellers trade in-game items, currency,
  account top-ups, game keys, and vouchers across 200+ game categories including Roblox, Genshin Impact,
  Mobile Legends, Dota 2, Steam, and Growtopia. The company reached one million orders in 2018, launched
  its Android app and gaming blog in 2020, and became part of Bukalapak (IDX: BUKA) in May 2021. Five Jack
  was surfaced as a portfolio company of 500 Global and added to the API Evangelist network. It operates a
  consumer-facing marketplace and does not currently publish a public developer API, SDKs, or developer
  portal.
